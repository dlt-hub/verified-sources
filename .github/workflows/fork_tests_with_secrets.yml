
name: test sources from forks with secrets

on:
  pull_request_target:
    branches:
      - master
    types:
      - labeled
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    name: authorize fork run (requires reviewer approval)
    # pull requests from this repository get secrets in the workflows below on pull_request
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository
      && contains(github.event.pull_request.labels.*.name, 'ci from fork')
      && (github.event.action == 'synchronize' || github.event.label.name == 'ci from fork')
    runs-on: ubuntu-latest
    environment: fork-ci
    steps:
      - run: echo "Fork PR authorized, running tests with secrets on ${{ github.event.pull_request.head.sha }}"

  test_on_local_destinations:
    name: fork
    needs: [authorize]
    uses: ./.github/workflows/test_on_local_destinations.yml
    secrets: inherit

  test_destinations_slow:
    name: fork
    needs: [authorize]
    uses: ./.github/workflows/test_destinations_slow.yml
    secrets: inherit
