
name: init

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:

  run_init:
    name: tests dlt init compatibility
    runs-on: ubuntu-latest

    steps:

      - name: Check out
        uses: actions/checkout@v4
        with:
          # the base branch to check the versions of changed sources against
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync  --only-group dltpure --only-group pytest

      - name: Run lint
        run: make lint-dlt-init
