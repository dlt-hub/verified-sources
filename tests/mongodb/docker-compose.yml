services:
  mongodb:
    image: mongo:8
    container_name: dlt_mongodb
    restart: unless-stopped
    ports:
      - 27017:27017
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1}).ok"]
      interval: 2s
      retries: 30
      start_period: 60s
      start_interval: 1s
