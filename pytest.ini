[pytest]
norecursedirs= .* _* build dist
addopts= -v --showlocals --durations 10 -m "not performance and not large_data"
markers =
  performance: reads the performance data of a seeded test account, run with `-m performance`
  large_data: reads gigabytes from a seeded test account to check the data, run with `-m large_data`
xfail_strict= true
log_cli= 1
log_cli_level= INFO
filterwarnings =
  ignore:Deprecated call to `pkg_resources.declare_namespace
